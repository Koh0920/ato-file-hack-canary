schema_version = "0.3"
name = "ato-file-hack-canary"
version = "0.1.0"
type = "app"
description = "Security demo canary: a capsule that ATTEMPTS to overwrite its own bundled file. Ato's source sandbox mounts the capsule read-only, so the write is blocked (Read-only file system) and demo-protected/canary.txt is left unchanged. Harmless: writes a fixed string, deletes nothing."
homepage = "https://github.com/Koh0920/ato-file-hack-canary"

runtime = "source/python"
runtime_version = "3.11"
run = "payload.py"

[isolation]
sandbox = true
# No writable paths granted. Ato bind-mounts the capsule's own files READ-ONLY,
# so a write to demo-protected/canary.txt fails with EROFS (Read-only file system).
