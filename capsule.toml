schema_version = "0.3"
name = "ato-file-hack-canary"
version = "0.2.0"
type = "app"
description = "Security demo canary: tries to overwrite its own bundled file, gets blocked by Ato's read-only sandbox mount (EROFS), then serves a small report page proving the write was denied and the file is unchanged. Harmless: writes a fixed string, deletes nothing, reads no secrets."
homepage = "https://github.com/Koh0920/ato-file-hack-canary"
default_target = "main"

# Service form: declaring `port` lets Ato synthesize an honest TCP readiness probe
# (the run is reported Ready only after the port actually accepts), so the PWA can
# open the app and show the result. The forbidden write still genuinely fails first.
[targets.main]
runtime = "source"
driver = "python"
runtime_version = "3.11"
port = 8000
run = "python payload.py"

[isolation]
sandbox = true
